version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - npm ci
    build:
      commands:
        # SITE_ORIGIN comes from Amplify Console → App settings → Environment variables.
        # Setting it makes canonical URLs, Open Graph URLs, JSON-LD identity and sitemap.xml
        # point at your real deploy origin. If unset, those declarations are omitted.
        - SITE_ORIGIN="${SITE_ORIGIN}" npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*.html'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=300, must-revalidate'
    - pattern: 'assets/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.@(svg|png|jpg|jpeg|webp|ico|xml|txt|json)'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=3600'
